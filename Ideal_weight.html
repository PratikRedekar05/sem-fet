<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ideal Weight by Height</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f7f9fc;
    }

    h1 {
      color: #2c3e50;
      text-align: center;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      background-color: #3498db;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #2980b9;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 4px;
      background-color: #e8f4fd;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Ideal Weight by Height</h1>

  <label for="height">Enter height (cm):</label>

  <input 
    type="number" 
    id="height" 
    placeholder="e.g. 165" 
    min="50" 
    max="250"
  />

  <button onclick="calculateWeight()">
    Calculate Ideal Weight
  </button>

  <div id="result" class="result"></div>

  <script>
    function calculateWeight() {

      const resultEl = document.getElementById("result");
      resultEl.innerHTML = "";

      const heightCm = parseFloat(
        document.getElementById("height").value
      );

      if (isNaN(heightCm) || heightCm <= 0) {
        resultEl.innerHTML =
          '<span class="error">Please enter a valid height in cm.</span>';
        return;
      }

      const heightM = heightCm / 100;

      const bmiLow = 18.5;
      const bmiHigh = 24.9;

      const weightLow = bmiLow * heightM * heightM;
      const weightHigh = bmiHigh * heightM * heightM;

      resultEl.innerHTML = `
        <p>For a height of <strong>${heightCm} cm</strong>:</p>

        <p><strong>Ideal (normal) weight range:</strong></p>

        <p>
          Minimum:
          <strong>${weightLow.toFixed(1)} kg</strong>
        </p>

        <p>
          Maximum:
          <strong>${weightHigh.toFixed(1)} kg</strong>
        </p>

        <p>
          <small>
            Based on WHO BMI range 18.5–24.9 for adults.
          </small>
        </p>
      `;
    }
  </script>

</body>
</html>
